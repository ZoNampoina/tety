name: Tester et publier Tety

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tety-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v6
      - name: Préparer Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Vérifier les données et les archives
        run: npm test
      - name: Vérifier la syntaxe de l’application
        run: for source in dist/*.mjs dist/sw.js; do node --check "$source"; done
      - name: Préparer l’application statique
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publier l’application
        id: deployment
        uses: actions/deploy-pages@v4
